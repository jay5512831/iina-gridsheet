<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>多宫格缩略图</title>
  <style>
* {
  box-sizing: border-box;
}

html,
body {
  height: 100%;
  margin: 0;
}

body {
  background:
    radial-gradient(1100px 520px at 50% -12%, #26262e 0%, rgba(38, 38, 46, 0) 62%),
    #141417;
  color: #f2f2f7;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
    "Helvetica Neue", Arial, sans-serif;
  font-size: 13px;
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
  user-select: none;
}

.app {
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* ---------------- 顶部标题 ---------------- */

.topbar {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 24px;
  padding: 18px 24px 10px;
}

.titleblock {
  min-width: 0;
  flex: 1;
}

.eyebrow {
  font-size: 10.5px;
  font-weight: 600;
  letter-spacing: 0.16em;
  color: #86868f;
}

.filename {
  margin: 5px 0 0;
  font-size: 19px;
  line-height: 1.25;
  font-weight: 650;
  letter-spacing: 0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
  padding-bottom: 2px;
}

.chip {
  font-size: 11px;
  line-height: 1;
  padding: 5px 9px;
  border-radius: 999px;
  color: #b9b9c2;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.07);
  white-space: nowrap;
}

/* ---------------- 工具栏 ---------------- */

.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 8px 24px 14px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.06);
}

.toolbar-left {
  display: flex;
  align-items: center;
  gap: 16px;
  min-width: 0;
}

.width-select {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: #a4a4ad;
  white-space: nowrap;
}

.width-select select {
  height: 27px;
  padding: 0 6px;
  border-radius: 7px;
  border: 1px solid rgba(255, 255, 255, 0.09);
  background: #202026;
  color: #e8e8ee;
  font: inherit;
  font-size: 11.5px;
  outline: none;
  cursor: pointer;
}

.width-select select:disabled {
  opacity: 0.45;
  cursor: default;
}

.location-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: #a4a4ad;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}

.location-toggle:hover {
  color: #e8e8ee;
}

.location-toggle input {
  appearance: none;
  -webkit-appearance: none;
  width: 16px;
  height: 16px;
  margin: 0;
  border-radius: 4px;
  border: 1px solid #4a4a55;
  background: #232329;
  position: relative;
  cursor: pointer;
  flex: none;
}

.location-toggle input:checked {
  background: #0a84ff;
  border-color: #0a84ff;
}

.location-toggle input:checked::after {
  content: "";
  position: absolute;
  left: 4px;
  top: 1px;
  width: 5px;
  height: 9px;
  border: solid #fff;
  border-width: 0 2px 2px 0;
  transform: rotate(45deg);
}

.location-toggle input:disabled {
  opacity: 0.45;
  cursor: default;
}

.grid-picker {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border-radius: 9px;
  background: #202026;
  border: 1px solid rgba(255, 255, 255, 0.05);
}

.seg {
  border: 0;
  background: transparent;
  color: #9b9ba4;
  font: inherit;
  font-size: 11.5px;
  font-weight: 500;
  padding: 5px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.12s ease, color 0.12s ease;
}

.seg:hover {
  color: #f2f2f7;
  background: rgba(255, 255, 255, 0.06);
}

.seg.active {
  color: #fff;
  background: #3a3a45;
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.07);
}

.actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.btn {
  height: 29px;
  padding: 0 13px;
  border-radius: 8px;
  border: 1px solid rgba(255, 255, 255, 0.09);
  background: #26262d;
  color: #e9e9ef;
  font: inherit;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  transition: background 0.12s ease, border-color 0.12s ease, opacity 0.12s ease;
  white-space: nowrap;
}

.btn:hover:not(:disabled) {
  background: #32323b;
}

.btn:active:not(:disabled) {
  background: #3a3a44;
}

.btn.primary {
  background: #0a84ff;
  border-color: #0a84ff;
  color: #fff;
}

.btn.primary:hover:not(:disabled) {
  background: #2f97ff;
  border-color: #2f97ff;
}

.btn.ghost {
  background: transparent;
}

.btn.ghost:hover:not(:disabled) {
  background: rgba(255, 255, 255, 0.06);
}

.btn:disabled {
  opacity: 0.35;
  cursor: default;
}

/* ---------------- 预览区 ---------------- */

.stage {
  flex: 1;
  min-height: 0;
  padding: 18px 24px 10px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.viewer {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}

.sheet-wrap {
  position: relative;
  display: inline-block;
  max-width: 100%;
  max-height: 100%;
  border-radius: 12px;
  overflow: hidden;
  background: #0c0c0f;
  box-shadow:
    0 24px 70px rgba(0, 0, 0, 0.55),
    0 0 0 1px rgba(255, 255, 255, 0.08);
}

.sheet-wrap[hidden] {
  display: none;
}

.sheet-wrap img {
  display: block;
  max-width: 100%;
  max-height: calc(100vh - 226px);
  width: auto;
  height: auto;
}

.cells {
  position: absolute;
  inset: 0;
  display: grid;
}

.cell {
  position: relative;
  border-radius: 3px;
  cursor: pointer;
  transition: background 0.12s ease, box-shadow 0.12s ease;
}

.cell:hover {
  background: rgba(10, 132, 255, 0.16);
  box-shadow: inset 0 0 0 2px #0a84ff;
}

.cell::after {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  width: 38px;
  height: 38px;
  margin: -19px 0 0 -19px;
  border-radius: 50%;
  background: rgba(0, 0, 0, 0.55);
  opacity: 0;
  transform: scale(0.88);
  transition: opacity 0.14s ease, transform 0.14s ease;
  pointer-events: none;
}

.cell::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 50%;
  margin: -7px 0 0 -5px;
  border-left: 11px solid #fff;
  border-top: 7px solid transparent;
  border-bottom: 7px solid transparent;
  opacity: 0;
  z-index: 1;
  transition: opacity 0.14s ease;
  pointer-events: none;
}

.cell:hover::after,
.cell:hover::before {
  opacity: 1;
}

.cell:hover::after {
  transform: scale(1);
}

.cells.no-seek .cell {
  cursor: default;
  pointer-events: none;
}

/* ---------------- 加载 / 错误状态 ---------------- */

.placeholder {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 40px;
  text-align: center;
}

.placeholder[hidden] {
  display: none;
}

.spinner {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-top-color: #0a84ff;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.loading-title {
  font-size: 14px;
  font-weight: 550;
  color: #e9e9ef;
}

.progress {
  width: 280px;
  max-width: 60vw;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.08);
  overflow: hidden;
}

.progress-bar {
  width: 0;
  height: 100%;
  border-radius: 2px;
  background: linear-gradient(90deg, #0a84ff, #64d2ff);
  transition: width 0.2s ease;
}

.loading-detail {
  max-width: 560px;
  font-size: 11.5px;
  line-height: 1.55;
  color: #8e8e97;
  white-space: pre-wrap;
}

.placeholder.error .spinner {
  display: none;
}

.placeholder.error .progress {
  display: none;
}

.placeholder.error .loading-title {
  color: #ff9f9f;
}

.placeholder.error .loading-detail {
  color: #d3a3a3;
}

/* ---------------- 底栏 + 提示 ---------------- */

.statusbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 9px 24px 12px;
  border-top: 1px solid rgba(255, 255, 255, 0.06);
  font-size: 11px;
  color: #84848d;
}

.status {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.saved-path:empty {
  display: none;
}

.saved-path {
  max-width: 58%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  color: #6f6f78;
  cursor: pointer;
}

.saved-path:hover {
  color: #b9b9c2;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 46px;
  z-index: 10;
  padding: 8px 16px;
  border-radius: 999px;
  font-size: 12px;
  color: #f2f2f7;
  background: rgba(44, 44, 52, 0.96);
  border: 1px solid rgba(255, 255, 255, 0.12);
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
  opacity: 0;
  transform: translateX(-50%) translateY(8px);
  transition: opacity 0.18s ease, transform 0.18s ease;
  pointer-events: none;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast.error {
  background: rgba(86, 32, 36, 0.97);
  border-color: rgba(255, 120, 120, 0.35);
}

</style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="titleblock">
        <div class="eyebrow">多宫格缩略图</div>
        <h1 id="filename" class="filename">等待视频…</h1>
      </div>
      <div id="meta" class="meta"></div>
    </header>

    <div class="toolbar">
      <div class="toolbar-left">
        <div class="grid-picker" id="gridPicker" role="group" aria-label="网格大小"></div>
        <label class="width-select" title="输出图片的宽度（像素）">
          <span>输出宽度</span>
          <select id="outputWidth">
            <option value="1920">1920 px</option>
            <option value="2560">2560 px</option>
            <option value="3840">3840 px</option>
            <option value="5120">5120 px</option>
          </select>
        </label>
        <label class="location-toggle" title="开启后，缩略图默认保存在视频所在文件夹；关闭则保存到图片文件夹">
          <input type="checkbox" id="saveToVideoDir">
          <span>保存到视频目录</span>
        </label>
      </div>
      <div class="actions">
        <button id="regenerate" class="btn" type="button">重新生成</button>
        <button id="reveal" class="btn primary" type="button" disabled>在访达中显示</button>
        <button id="copy" class="btn" type="button" disabled>复制图片</button>
        <button id="saveAs" class="btn ghost" type="button" disabled>另存为…</button>
      </div>
    </div>

    <main class="stage">
      <div class="viewer">
        <div class="sheet-wrap" id="sheetWrap" hidden>
          <img id="sheet" alt="视频多宫格缩略图">
          <div class="cells" id="cells"></div>
        </div>
        <div class="placeholder" id="placeholder">
          <div class="spinner"></div>
          <div class="loading-title" id="loadingTitle">正在准备…</div>
          <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
          <div class="loading-detail" id="loadingDetail"></div>
        </div>
      </div>
    </main>

    <footer class="statusbar">
      <span id="status" class="status">点击任意画面可跳转到对应时间</span>
      <span id="savedPath" class="saved-path" title=""></span>
    </footer>
  </div>

  <div id="toast" class="toast"></div>
  <script>
(function () {
  "use strict";

  const api = window.iina;
  const GRID_OPTIONS = [
    [3, 3],
    [4, 3],
    [4, 4],
    [5, 4],
    [6, 4],
  ];

  const el = function (id) {
    return document.getElementById(id);
  };

  let current = { cols: 4, rows: 3 };
  let times = [];
  let canSeek = false;
  let savedPath = "";
  let busy = false;
  let toastTimer = null;

  function pad2(n) {
    return n < 10 ? "0" + n : String(n);
  }

  function formatTime(seconds, withHours) {
    const sec = Math.max(0, Math.floor(Number(seconds) || 0));
    const h = Math.floor(sec / 3600);
    const m = Math.floor((sec % 3600) / 60);
    const s = sec % 60;
    if (h > 0 || withHours) return pad2(h) + ":" + pad2(m) + ":" + pad2(s);
    return pad2(m) + ":" + pad2(s);
  }

  function showToast(text, kind) {
    const toast = el("toast");
    toast.textContent = text;
    toast.className = "toast show" + (kind === "error" ? " error" : "");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toast.className = "toast";
    }, 2400);
  }

  function setStatus(text) {
    el("status").textContent = text;
  }

  function setProgress(done, total) {
    const pct = total > 0 ? Math.min(100, Math.round((done / total) * 100)) : 0;
    el("progressBar").style.width = pct + "%";
  }

  function setActionsEnabled(enabled) {
    el("reveal").disabled = !enabled;
    el("copy").disabled = !enabled;
    el("saveAs").disabled = !enabled;
  }

  function updateSavedPath(path) {
    savedPath = path || "";
    const node = el("savedPath");
    node.textContent = savedPath.replace(/^\/Users\/[^/]+\//, "~/");
    node.title = savedPath;
  }

  function setActiveGrid(cols, rows) {
    const buttons = el("gridPicker").querySelectorAll(".seg");
    for (let i = 0; i < buttons.length; i++) {
      const button = buttons[i];
      button.classList.toggle(
        "active",
        Number(button.dataset.cols) === cols && Number(button.dataset.rows) === rows
      );
    }
  }

  function buildGridPicker() {
    const picker = el("gridPicker");
    picker.innerHTML = "";
    GRID_OPTIONS.forEach(function (option) {
      const cols = option[0];
      const rows = option[1];
      const button = document.createElement("button");
      button.type = "button";
      button.className = "seg";
      button.dataset.cols = String(cols);
      button.dataset.rows = String(rows);
      button.textContent = cols + "×" + rows;
      button.addEventListener("click", function () {
        if (busy) return;
        if (cols === current.cols && rows === current.rows) return;
        current = { cols: cols, rows: rows };
        setActiveGrid(cols, rows);
        showLoading("正在重新生成…", "");
        api.postMessage("regenerate", { cols: cols, rows: rows });
      });
      picker.appendChild(button);
    });
    setActiveGrid(current.cols, current.rows);
  }

  function showLoading(title, detail) {
    const placeholder = el("placeholder");
    placeholder.hidden = false;
    placeholder.classList.remove("error");
    el("loadingTitle").textContent = title || "正在生成…";
    el("loadingDetail").textContent = detail || "";
    el("sheetWrap").hidden = true;
    el("regenerate").disabled = true;
    el("saveToVideoDir").disabled = true;
    el("outputWidth").disabled = true;
    setActionsEnabled(false);
    setProgress(0, 1);
    busy = true;
  }

  function showError(message) {
    const placeholder = el("placeholder");
    placeholder.hidden = false;
    placeholder.classList.add("error");
    el("loadingTitle").textContent = "生成失败";
    el("loadingDetail").textContent = message || "未知错误";
    el("sheetWrap").hidden = true;
    el("regenerate").disabled = false;
    el("saveToVideoDir").disabled = false;
    el("outputWidth").disabled = false;
    setActionsEnabled(false);
    setStatus("生成失败，可调整网格后重试");
    busy = false;
  }

  function setSaveToggle(value) {
    el("saveToVideoDir").checked = value !== false;
  }

  function setOutputWidth(value) {
    if (value) el("outputWidth").value = String(value);
  }

  function renderMeta(meta) {
    const box = el("meta");
    box.innerHTML = "";
    if (!meta) return;
    const values = [];
    if (meta.duration > 0) {
      values.push(formatTime(meta.duration, meta.duration >= 3600));
    }
    if (meta.sheetWidth > 0 && meta.sheetHeight > 0) {
      values.push("输出 " + meta.sheetWidth + "×" + meta.sheetHeight);
    } else if (meta.width > 0 && meta.height > 0) {
      values.push(meta.width + "×" + meta.height);
    }
    if (meta.cols && meta.rows) {
      values.push(meta.cols + "×" + meta.rows + " 网格");
    }
    if (meta.elapsed) {
      values.push("耗时 " + meta.elapsed + " 秒");
    }
    values.forEach(function (value) {
      const chip = document.createElement("span");
      chip.className = "chip";
      chip.textContent = value;
      box.appendChild(chip);
    });
  }

  function buildCells(cols, rows) {
    const layer = el("cells");
    layer.innerHTML = "";
    layer.style.gridTemplateColumns = "repeat(" + cols + ", 1fr)";
    layer.style.gridTemplateRows = "repeat(" + rows + ", 1fr)";
    layer.classList.toggle("no-seek", !canSeek);
    const withHours = times.length > 0 && times[times.length - 1] >= 3600;
    for (let i = 0; i < times.length; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      if (canSeek) {
        const time = times[i];
        cell.title = "跳转到 " + formatTime(time, withHours);
        cell.addEventListener("click", function () {
          api.postMessage("seek", { time: time });
        });
      }
      layer.appendChild(cell);
    }
  }

  /* ---------------- 消息 ---------------- */

  api.onMessage("init", function (data) {
    current = { cols: data.cols, rows: data.rows };
    setActiveGrid(data.cols, data.rows);
    el("filename").textContent = data.title || "视频";
    el("filename").title = data.filePath || data.title || "";
    if (data.duration) {
      renderMeta({
        duration: data.duration,
        width: data.width,
        height: data.height,
        cols: data.cols,
        rows: data.rows,
      });
    } else {
      el("meta").innerHTML = "";
    }
    showLoading(data.phase || "正在准备…", "");
    setSaveToggle(data.saveToVideoDir);
    setOutputWidth(data.outputWidth);
    setStatus("正在生成 " + data.cols + "×" + data.rows + " 缩略图…");
    updateSavedPath("");
  });

  api.onMessage("progress", function (data) {
    el("placeholder").hidden = false;
    el("loadingTitle").textContent = data.phase || "正在生成…";
    el("loadingDetail").textContent =
      data.total > 0 ? data.done + " / " + data.total + " 帧" : "";
    setProgress(data.done || 0, data.total || 1);
  });

  api.onMessage("render", function (data) {
    current = { cols: data.cols, rows: data.rows };
    setActiveGrid(data.cols, data.rows);
    times = Array.isArray(data.times) ? data.times : [];
    canSeek = !!data.canSeek;
    setSaveToggle(data.saveToVideoDir);
    setOutputWidth(data.outputWidth);
    renderMeta(data.meta);
    buildCells(data.cols, data.rows);
    updateSavedPath(data.savedPath);
    el("filename").textContent = (data.meta && data.meta.title) || "视频";

    const image = el("sheet");
    image.onload = function () {
      el("sheetWrap").hidden = false;
      el("placeholder").hidden = true;
      el("regenerate").disabled = false;
      el("saveToVideoDir").disabled = false;
      el("outputWidth").disabled = false;
      setActionsEnabled(true);
      busy = false;
      setStatus(
        canSeek
          ? "点击任意画面跳转到对应时间"
          : "该视频未在 IINA 中播放，点击跳转不可用"
      );
      showToast("已生成 " + data.cols + "×" + data.rows + " 缩略图");
    };
    image.onerror = function () {
      showError("图片加载失败。");
    };
    image.src = data.image;
  });

  api.onMessage("error", function (data) {
    showError(data && data.message);
    showToast("生成失败", "error");
  });

  api.onMessage("saved", function (data) {
    if (!data) return;
    if (data.path) updateSavedPath(data.path);
    if (typeof data.saveToVideoDir === "boolean") {
      setSaveToggle(data.saveToVideoDir);
    }
  });

  api.onMessage("toast", function (data) {
    if (data && data.text) showToast(data.text, data.kind);
  });

  /* ---------------- 交互 ---------------- */

  el("regenerate").addEventListener("click", function () {
    if (busy) return;
    showLoading("正在重新生成…", "");
    api.postMessage("regenerate", { cols: current.cols, rows: current.rows });
  });

  el("reveal").addEventListener("click", function () {
    api.postMessage("reveal");
  });

  el("copy").addEventListener("click", function () {
    api.postMessage("copy");
  });

  el("saveAs").addEventListener("click", function () {
    api.postMessage("saveAs");
  });

  el("savedPath").addEventListener("click", function () {
    if (savedPath) api.postMessage("reveal");
  });

  el("saveToVideoDir").addEventListener("change", function () {
    api.postMessage("setSaveLocation", { toVideoDir: this.checked });
  });

  el("outputWidth").addEventListener("change", function () {
    if (busy) return;
    showLoading("正在按 " + this.value + " px 重新生成…", "");
    api.postMessage("setOutputWidth", { width: Number(this.value) });
  });

  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      api.postMessage("close");
      return;
    }
    if ((event.metaKey || event.ctrlKey) && String(event.key).toLowerCase() === "s") {
      event.preventDefault();
      api.postMessage("saveAs");
    }
  });

  buildGridPicker();
  api.postMessage("ready");
})();

</script>
</body>
</html>
